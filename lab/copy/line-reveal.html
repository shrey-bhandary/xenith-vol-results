<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Xenith line reveal harness</title>
<link rel="stylesheet" href="reveal.css">
<style>
  @font-face{font-family:"PS2P";src:url("../../assets/fonts/PressStart2P.ttf") format("truetype");font-display:swap}
  :root{--ink:#06050f;--amber:#ffb15c;--cream:#ffe9b0;--mint:#9ef0c0;--dim:#8a83a6}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--ink);color:var(--cream)}
  body{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;overflow:hidden}
  #stage{position:fixed;inset:0}
  #stage::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 50%,transparent 42%,rgba(0,0,0,.34) 100%)}
  #content{
    position:absolute;z-index:2;left:clamp(22px,7vw,110px);top:50%;
    transform:translateY(calc(-50% + 10px));max-width:min(640px,72vw);
    opacity:0;transition:opacity 1.4s ease .2s,transform 1.4s cubic-bezier(.2,.8,.2,1) .2s;
  }
  body.entered #content{opacity:1;transform:translateY(-50%)}
  #name{font-family:"PS2P",ui-monospace,monospace;font-size:clamp(24px,4.4vw,50px);line-height:1.3;margin:0;color:var(--cream);text-shadow:2px 0 0 rgba(123,92,255,.38),-1px 0 0 rgba(255,92,59,.25)}
  #role{margin:20px 0 0;font-size:9.5px;letter-spacing:.36em;text-transform:uppercase;color:var(--amber)}
  #line{margin:18px 0 0;max-width:38ch;font-size:14px;line-height:1.85;color:rgba(255,233,176,.62)}
  #bar{position:absolute;left:clamp(22px,7vw,110px);bottom:26px;z-index:3;display:flex;gap:10px;align-items:center}
  select,button{background:#0d0a24;color:rgba(255,233,176,.72);border:1px solid rgba(255,233,176,.16);font:inherit;font-size:10px;padding:7px 9px;letter-spacing:.06em}
  button{cursor:pointer;color:var(--amber);border-color:rgba(255,177,92,.35)}
  button:hover,select:hover{border-color:rgba(255,233,176,.4)}
  .note{position:absolute;right:clamp(16px,4vw,40px);bottom:28px;font-size:9px;letter-spacing:.2em;text-transform:lowercase;color:rgba(255,233,176,.26)}
  @media (max-width:720px){
    #content{left:22px;right:22px;max-width:none}
    #name{font-size:clamp(22px,7vw,30px)}
    #line{font-size:13px;max-width:none}
    #bar{left:22px;bottom:18px}
    .note{display:none}
  }
</style>
</head>
<body>
<div id="stage">
  <main id="content">
    <h1 id="name"></h1>
    <p id="role"></p>
    <p id="line"></p>
  </main>
  <div id="bar">
    <select id="pick" aria-label="Choose a person"></select>
    <button id="replay" type="button">replay</button>
  </div>
  <span class="note">lab harness, line reveal only</span>
</div>
<script src="lines.js"></script>
<script src="reveal.js"></script>
<script>
(() => {
  const $ = (s) => document.querySelector(s);
  const people = {
    katherine: ["Katherine Augustine", "Events & Admin"],
    trinity: ["Trinity Fernandes", "Events & Admin"],
    adwitiya: ["Adwitiya Srivastava", "Events & Admin"],
    sanskrati: ["Sanskrati", "Design"],
    joann: ["Joann", "Design"],
    vaibhav: ["Vaibhav", "Marketing"],
    manan: ["Manan", "Tech"],
    marc: ["Marc", "Sponsorship"],
    alex: ["Alex", "Events & Admin"],
    siya: ["Siya", "Design"],
    vasu: ["Vasu", "Events & Admin"],
    bhavna: ["Bhavna", "Content"]
  };
  const pick = $("#pick");
  for (const key of Object.keys(people)) {
    const opt = document.createElement("option");
    opt.value = key;
    opt.textContent = people[key][0] + " · " + window.XENITH_COPY[key].family;
    pick.appendChild(opt);
  }

  let run = 0;

  function show(key) {
    const copy = window.XENITH_COPY[key];
    const line = $("#line");
    const token = ++run;
    window.XenithLine.finish();
    document.body.classList.remove("entered");
    $("#name").textContent = people[key][0];
    $("#role").textContent = people[key][1];
    line.textContent = copy.line;
    delete line.dataset.lnPlayed;
    const stale = line.querySelectorAll(".ln-caret");
    for (const n of stale) n.remove();

    requestAnimationFrame(() => {
      if (token !== run) return;
      document.body.classList.add("entered");
      window.XenithLine.start(line, { beat: copy.beat, start: 1600 });
    });
  }

  pick.addEventListener("change", () => show(pick.value));
  $("#replay").addEventListener("click", () => show(pick.value));
  show("katherine");
})();
</script>
</body>
</html>
