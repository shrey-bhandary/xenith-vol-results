<div id="stage">
  <canvas id="sky" aria-hidden="true"></canvas>
  <div id="photo" aria-hidden="true"></div>
  <canvas id="scene" aria-hidden="true"></canvas>
  <canvas id="rain" aria-hidden="true"></canvas>
  <canvas id="monument" aria-hidden="true"></canvas>
  <canvas id="confetti" aria-hidden="true"></canvas>
  <div id="scrim"></div>
  <div id="vignette"></div>

  <header class="hud">
    <span class="brand"><img class="brand-x" src="../assets/brand/xenith-x.svg" alt="X" width="11" height="11"><span>enith</span></span>
    <span>2026</span>
  </header>

  <main id="content">
    <h1 id="name" tabindex="-1">xenith</h1>
    <p id="role">talks and panel discussions</p>
    <p id="line">this page needs javascript to open. try a browser setting or a different browser.</p>
    <div class="actions">
      <button id="save" class="save" type="button">save card</button>
      <button id="copy" class="save" type="button">copy link</button>
    </div>
    <div class="join" id="join" hidden>
      <a class="save join-link" id="joinGroup" href="https://chat.whatsapp.com/ImUkwP8xh10K4q9OoxcpPn" target="_blank" rel="noopener noreferrer">join your group</a>
      <a class="save join-link" id="joinCommunity" href="https://chat.whatsapp.com/Ldux3gTtSLl4EuERClN7GN" target="_blank" rel="noopener noreferrer">join the community</a>
    </div>
    <div class="stamp-wrap">
      <canvas id="selectStamp" width="329" height="49" aria-hidden="true"></canvas>
      <span class="sr-only">selected</span>
      <span class="stamp-note" aria-hidden="true">xenith / 2026</span>
    </div>
      </main>

  <canvas id="rusty" aria-hidden="true"></canvas>
  <p id="live" class="sr-only" aria-live="polite"></p>

  <div id="gate">
    <canvas id="xpad" aria-label="Draw an X to enter"></canvas>
    <div class="prompt" id="prompt">
      <span class="p1">draw x</span>
      <span class="p2">to enter</span>
    </div>
    <button id="skip" type="button">skip</button>
  </div>
</div>

<script>
(function () {
  // The group links for Events & Admin. Admin crew get the admin group, every
  // other Events & Admin volunteer gets the events group, and everyone gets the
  // community.
  var COMMUNITY = "https://chat.whatsapp.com/Ldux3gTtSLl4EuERClN7GN";
  var ADMIN     = "https://chat.whatsapp.com/ImUkwP8xh10K4q9OoxcpPn";
  var EVENTS    = "https://chat.whatsapp.com/BrtqrsZfFQEG5BezyKL62s";
  var ADMIN_CREW = ["siya-kapoor", "siya", "siyak", "vasu", "sharen", "trinity", "mark", "marc", "aditri"];
  // CORE is already in both groups and in the community, so they get the page
  // without any join buttons.
  var CORE = ["aaditya", "ricco", "tejas"];

  var p = (new URLSearchParams(location.search).get("p") || "").toLowerCase();
  var people = window.XENITH_PEOPLE || {};
  var rec = people[p];
  var dept = rec ? String(rec.dept || "").toLowerCase() : "";

  if (!rec || dept.indexOf("events") < 0) return;
  if (CORE.indexOf(p) >= 0) return;

  var isAdmin = ADMIN_CREW.indexOf(p) >= 0;
  var box = document.getElementById("join");
  var group = document.getElementById("joinGroup");
  var comm = document.getElementById("joinCommunity");
  if (!box || !group || !comm) return;

  group.href = isAdmin ? ADMIN : EVENTS;
  group.textContent = isAdmin ? "join the admin group" : "join the events group";
  comm.href = COMMUNITY;
  box.hidden = false;
})();
</script>
