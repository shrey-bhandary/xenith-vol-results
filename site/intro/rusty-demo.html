<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Rusty rig</title>
<style>
@font-face{
  font-family:"PS2P";
  src:url("../../assets/fonts/PressStart2P.ttf") format("truetype");
  font-display:swap;
}
:root{
  --void:#05040c;
  --amber:#ffb15c;
  --cream:#ffe9b0;
  --violet:#7b5cff;
  --mint:#9ef0c0;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{
  background:var(--void);
  color:var(--cream);
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  -webkit-font-smoothing:antialiased;
  display:flex;align-items:center;justify-content:center;
  min-height:100svh;overflow:hidden;
}
main{
  display:flex;flex-direction:column;align-items:center;
  gap:14px;padding:20px;
}
header{
  width:min(320px,80vw);display:flex;justify-content:space-between;
  font-size:8px;letter-spacing:.34em;text-transform:lowercase;
  color:rgba(255,233,176,.42);
}
.stage{
  width:min(320px,80vw);
  aspect-ratio:320/360;
  border:1px solid rgba(255,177,92,.14);
  background:
    radial-gradient(60% 55% at 50% 46%, rgba(123,92,255,.07), transparent 70%),
    #05040c;
  box-shadow:0 0 90px rgba(123,92,255,.10);
  position:relative;
  cursor:crosshair;
}
.stage::after{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:repeating-linear-gradient(to bottom, rgba(0,0,0,0) 0 2px, rgba(0,0,0,.16) 2px 3px);
  mix-blend-mode:multiply;opacity:.5;
}
canvas{display:block;width:100%;height:100%;touch-action:manipulation}
.hud{
  width:min(320px,80vw);display:flex;justify-content:space-between;align-items:baseline;
  font-size:9px;letter-spacing:.28em;text-transform:lowercase;
  color:rgba(255,233,176,.6);
}
.hud b{font-weight:400;color:var(--amber)}
.hint{
  margin:0;font-size:8px;letter-spacing:.3em;text-transform:lowercase;
  color:rgba(255,233,176,.3);
}
button{
  background:none;border:0;padding:0;margin:0;font:inherit;color:inherit;
  letter-spacing:inherit;text-transform:inherit;cursor:pointer;
}
button:focus-visible{outline:2px solid var(--mint);outline-offset:4px}
@media (prefers-reduced-motion:reduce){
  .stage{box-shadow:none}
}
</style>
</head>
<body>
<main>
  <header><span>rusty rig</span><span>lab / intro</span></header>
  <div class="stage" id="stage">
    <canvas id="rusty-rig" aria-hidden="true"></canvas>
  </div>
  <div class="hud" role="status" aria-live="polite">
    <span id="num">01 / 10</span>
    <b id="state">boot</b>
  </div>
  <p class="hint">click to cycle. move to look.</p>
</main>

<script src="rusty.js"></script>
<script>
(function () {
  "use strict";

  var STATES = ["boot", "idle", "curious", "thinking", "proud", "excited", "confused", "scanning", "presenting", "celebrating"];
  var cv = document.getElementById("rusty-rig");
  var numEl = document.getElementById("num");
  var stateEl = document.getElementById("state");
  var stage = document.getElementById("stage");
  var rig = window.RustyRig && window.RustyRig.mount(cv);
  var idx = 0;
  var bootTimer = 0;
  var last = 0;

  if (!rig) {
    stateEl.textContent = "no rig";
    return;
  }

  function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }

  function hud() {
    numEl.textContent = (idx < 9 ? "0" : "") + (idx + 1) + " / " + STATES.length;
    stateEl.textContent = STATES[idx];
  }

  function go(n) {
    idx = (n + STATES.length) % STATES.length;
    rig.setState(STATES[idx]);
    hud();
  }

  function next() {
    clearTimeout(bootTimer);
    go(idx + 1);
  }

  function prev() {
    clearTimeout(bootTimer);
    go(idx - 1);
  }

  function look(e) {
    var r = cv.getBoundingClientRect();
    if (!r.width || !r.height) return;
    rig.setGaze(
      clamp((e.clientX - (r.left + r.width / 2)) / (r.width / 2), -1, 1),
      clamp((e.clientY - (r.top + r.height / 2)) / (r.height / 2), -1, 1)
    );
  }

  stage.addEventListener("click", next);
  addEventListener("pointermove", look, { passive: true });
  document.addEventListener("pointerleave", function () { rig.setGaze(0, 0); });
  addEventListener("keydown", function (e) {
    if (e.key === " " || e.key === "Enter" || e.key === "ArrowRight") {
      e.preventDefault();
      next();
    } else if (e.key === "ArrowLeft") {
      e.preventDefault();
      prev();
    }
  });

  hud();
  rig.setState("boot");
  bootTimer = setTimeout(function () {
    if (idx === 0) go(1);
  }, 3000);

  function frame(t) {
    requestAnimationFrame(frame);
    var dt = last ? Math.min(64, t - last) : 16.7;
    last = t;
    rig.update(dt);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
