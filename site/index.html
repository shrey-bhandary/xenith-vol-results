<script>
// Events & Admin vols keep the original reveal; every other department keeps the
// newer design. Runs before anything paints so there is no flash.
(function(){
  try {
    var p = (new URLSearchParams(location.search).get("p") || "").toLowerCase();
    var OURS = "aaditya,ricco,tejas,siya-kapoor,vasu,sharen,trinity,mark,aditri,amy,alastair,royden,adelaide,naisha,bhavna,madhura,sanskrati,vaibhav,manan,satwik,dhriti,khushi,manthan,liyaan,siya,siyak,marc,adwitiya".split(",");
    if (OURS.indexOf(p) >= 0 && location.pathname.indexOf("ours.html") < 0) {
      location.replace("ours.html" + location.search + location.hash);
    }
  } catch (e) {}
})();
</script>
<script>
(function(){ try { if (new URLSearchParams(location.search).get("engine") === "1") document.documentElement.classList.add("engine-pending"); } catch(e){} })();
</script>

<body class="locked">
<noscript><style>#gate{display:none}.actions{display:none}#content,#rusty{opacity:1!important;visibility:visible!important}body.locked #content{opacity:1;visibility:visible}</style></noscript>
<div id="stage">
  <canvas id="sky" aria-hidden="true"></canvas>
  <div id="photo" aria-hidden="true"></div>
  <canvas id="scene" aria-hidden="true"></canvas>
  <canvas id="rain" aria-hidden="true"></canvas>
  <canvas id="monument" aria-hidden="true"></canvas>
  <canvas id="confetti" aria-hidden="true"></canvas>
  <div id="scrim"></div>
  <div id="vignette"></div>
  <div id="scanlines"></div>

  <header class="hud">
    <span class="brand"><img class="brand-x" src="../assets/brand/xenith-x.svg" alt="X" width="11" height="11"><span>enith</span></span>
    <span>2026</span>
  </header>

  <main id="content">
    <div class="stamp-wrap">
      <canvas id="selectStamp" width="329" height="49" aria-hidden="true"></canvas>
      <span class="sr-only">selected</span>
    </div>
    <div id="deptNav" class="dept-nav" hidden></div>
    <p id="role">talks and panel discussions</p>
    <p id="line">this page needs javascript to open. try a browser setting or a different browser.</p>
    <h1 id="name" tabindex="-1">xenith</h1>
    <div class="actions">
      <div id="waLinks"></div>
      <button id="save" class="save" type="button">save card</button>
      <button id="copy" class="save" type="button">copy link</button>
    </div>
  </main>

  <canvas id="rusty" aria-hidden="true"></canvas>
  <p id="live" class="sr-only" aria-live="polite"></p>

  <div id="gate">
    <canvas id="xpad" aria-label="Draw an X to enter"></canvas>
    <div class="prompt" id="prompt">
      <span class="p1">draw x</span>
      <span class="p2">to enter</span>
    </div>
  </div>
</div>

<script>
(function(){
  var u = new URL(location.href);
  if (u.searchParams.get("entered") || u.searchParams.get("gate")) return;
  location.replace("intro/" + location.search);
})();
</script>
