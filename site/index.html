<!doctype html>
<html lang="en">
<head>
<script>
(function(){ try { if (new URLSearchParams(location.search).get("engine") === "1") document.documentElement.classList.add("engine-pending"); } catch(e){} })();
</script>
<meta charset="utf-8">
<link rel="icon" href="../assets/brand/xenith-x.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="../assets/brand/app-icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Xenith</title>
<link rel="stylesheet" href="style.css?v=2">
</head>
<body class="locked">
<noscript><style>#gate{display:none}#content,#rusty{opacity:1!important;visibility:visible!important}body.locked #content{opacity:1;visibility:visible}</style></noscript>
<div id="stage">
  <canvas id="sky" aria-hidden="true"></canvas>
  <div id="photo" aria-hidden="true"></div>
  <canvas id="scene" aria-hidden="true"></canvas>
  <canvas id="rain" aria-hidden="true"></canvas>
  <canvas id="monument" aria-hidden="true"></canvas>
  <canvas id="confetti" aria-hidden="true"></canvas>
  <div id="scrim"></div>
  <div id="selectStamp" aria-hidden="true">SELECTED</div>
  <div id="vignette"></div>
  <div id="scanlines"></div>

  <header class="hud">
    <span class="brand"><img class="brand-x" src="../assets/brand/xenith-x.svg" alt="" width="11" height="11"><span>enith</span></span>
    <span>2026</span>
  </header>

  <main id="content">
    <h1 id="name" tabindex="-1"></h1>
    <p id="role"></p>
    <p id="line"></p>
    <div class="actions">
      <button id="save" class="save" type="button">save card</button>
      <button id="copy" class="save" type="button">copy link</button>
    </div>
      </main>

  <canvas id="rusty" aria-hidden="true"></canvas>
  <p id="live" class="sr-only" aria-live="polite"></p>

  <div id="gate">
    <canvas id="xpad" aria-label="Draw an X to enter"></canvas>
    <div class="prompt" id="prompt">
      <span class="p1">draw x</span>
      <span class="p2">to enter</span>
    </div>
    <button id="skip" type="button">skip</button>
  </div>
</div>

<script>
(function(){
  var u = new URL(location.href);
  if (u.searchParams.get("entered") || u.searchParams.get("gate")) return;
  location.replace("intro/" + location.search);
})();
</script>
<script src="data.js?v=4"></script>
<script src="card.js?v=4"></script>
<script src="swarm.js?v=4"></script>
<link rel="stylesheet" href="vendor/glass-reveal.css">
<script src="vendor/glass-renderer.js"></script>
<script src="vendor/glass-reveal.js"></script>
<script src="xenith.js?v=4"></script>
</body>
</html>
